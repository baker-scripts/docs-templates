name: Bug Report
description: Report a problem with a template
labels: ["bug"]
body:
  - type: dropdown
    id: template
    attributes:
      label: Template
      description: Which template is affected?
      options:
        - Plex Guide
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Clone the repo
        2. Run setup.sh
        3. ...

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant parts of your `extra:` config (remove any personal info).
      render: yaml

  - type: input
    id: template-version
    attributes:
      label: docs-templates version
      description: Which commit/tag are you on? Run `git rev-parse --short HEAD`. Check you're not behind `main` before reporting — it may already be fixed.
      placeholder: "e.g. a6bde17, or 'main as of 2026-03-12'"
    validations:
      required: true

  - type: textarea
    id: mkdocs-version
    attributes:
      label: Dependency versions
      description: Output of `pip freeze | grep -i mkdocs` (captures mkdocs, mkdocs-material, and mkdocs-macros-plugin versions)
      placeholder: |
        mkdocs==1.6.1
        mkdocs-material==9.x.x
        mkdocs-macros-plugin==1.x.x
